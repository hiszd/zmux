[package]
name = "zmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
alacritty_terminal = "0.26"
crossterm = "0.29"
mlua = { version = "0.12", features = ["luajit", "vendored"] }
portable-pty = "0.9"
ratatui = "0.30"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
interprocess = "2.4"
libc = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"
widestring = "1.2"

[dev-dependencies]
bincode_v1 = { package = "bincode", version = "1.3" }
