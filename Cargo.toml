[package]
name = "zmux"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.25"
crossterm = "0.28"
mlua = { version = "0.11", features = ["luajit", "vendored"] }
portable-pty = "0.8"
ratatui = "0.29"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
interprocess = "2.4"
libc = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"
widestring = "1.2"

[dev-dependencies]
